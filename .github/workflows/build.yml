name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore -p:Platform=x64 -r win-x64

      # Both MSIX variants are signed with the stable self-signed cert from the
      # MSIX_CERT_PFX_BASE64 secret (base64-encoded certs/BrightFlyout.pfx).
      - name: Decode signing certificate
        shell: pwsh
        run: |
          $b64 = "${{ secrets.MSIX_CERT_PFX_BASE64 }}"
          if ([string]::IsNullOrWhiteSpace($b64)) {
            throw "MSIX_CERT_PFX_BASE64 secret is not set. See README -> Distribution."
          }
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($b64))
          $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new("cert.pfx")
          [IO.File]::WriteAllBytes("BrightFlyout.cer", $cert.Export([Security.Cryptography.X509Certificates.X509ContentType]::Cert))

      # The MSIX identity version comes from the csproj <Version> (X.Y.Z -> X.Y.Z.0).
      - name: Stamp package version
        shell: pwsh
        run: |
          $v = ([xml](Get-Content BrightFlyout.csproj)).Project.PropertyGroup.Version | Select-Object -First 1
          $m = [IO.File]::ReadAllText("Package.appxmanifest")
          $m = $m -replace '(<Identity[^>]*Version=")[\d.]+(")', "`${1}$v.0`${2}"
          [IO.File]::WriteAllText("Package.appxmanifest", $m, [Text.UTF8Encoding]::new($true))

      # Both variants pull the Windows App SDK automatically as the
      # Microsoft.WindowsAppRuntime.2 framework package from the Store at install
      # (PackageDependency is injected by the build).
      #
      # Artifact 1: AOT MSIX - NativeAOT exe only (~4.5 MB). The WMI path
      # (internal laptop panels) is not AOT-clean.
      - name: Publish MSIX (AOT)
        run: >-
          dotnet publish -c Release -p:Platform=x64 -r win-x64 --no-restore
          -p:BuildMSIX=true -p:PublishAot=true -p:EnableMsixTooling=true
          -p:GenerateAppxPackageOnBuild=true -p:AppxBundle=Never
          -p:PackageCertificateKeyFile=cert.pfx
          -p:AppxPackageDir=out\aot\

      # The two variants must not share intermediate state: switching PublishAot
      # on the same obj/bin has produced corrupted packages locally. Full reset.
      - name: Clean intermediates between variants
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force bin, obj -ErrorAction SilentlyContinue
          dotnet restore -p:Platform=x64 -r win-x64

      # Artifact 2: hybrid MSIX - trimmed .NET 10 runtime inside (~10 MB),
      # reliable WMI path (System.Management is not trimmable and is kept whole).
      - name: Publish MSIX (hybrid)
        run: >-
          dotnet publish -c Release -p:Platform=x64 -r win-x64 --no-restore
          -p:BuildMSIX=true -p:PublishAot=false -p:SelfContained=true
          -p:PublishTrimmed=true -p:EnableMsixTooling=true
          -p:GenerateAppxPackageOnBuild=true -p:AppxBundle=Never
          -p:PackageCertificateKeyFile=cert.pfx
          -p:AppxPackageDir=out\hybrid\

      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force staging | Out-Null
          Copy-Item (Get-Item out/aot/**/*_x64.msix).FullName staging/BrightFlyout_AOT_x64.msix
          Copy-Item (Get-Item out/hybrid/**/*_x64.msix).FullName staging/BrightFlyout_Hybrid_x64.msix
          Copy-Item BrightFlyout.cer staging/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BrightFlyout-${{ github.sha }}
          path: staging/*
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create ${{ github.ref_name }}
          staging/BrightFlyout_AOT_x64.msix staging/BrightFlyout_Hybrid_x64.msix staging/BrightFlyout.cer
          --title "BrightFlyout ${{ github.ref_name }}"
          --generate-notes
