name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Both MSIX variants are signed with the stable self-signed cert from the
      # MSIX_CERT_PFX_BASE64 secret (base64-encoded certs/BrightFlyout.pfx).
      - name: Decode signing certificate
        shell: pwsh
        run: |
          $b64 = "${{ secrets.MSIX_CERT_PFX_BASE64 }}"
          if ([string]::IsNullOrWhiteSpace($b64)) {
            throw "MSIX_CERT_PFX_BASE64 secret is not set. See README -> Distribution."
          }
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($b64))
          $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new("cert.pfx")
          [IO.File]::WriteAllBytes("BrightFlyout.cer", $cert.Export([Security.Cryptography.X509Certificates.X509ContentType]::Cert))

      # The MSIX identity version comes from the csproj <Version> (X.Y.Z -> X.Y.Z.0).
      - name: Stamp package version
        shell: pwsh
        run: |
          $v = ([xml](Get-Content BrightFlyout.csproj)).Project.PropertyGroup.Version | Select-Object -First 1
          $m = [IO.File]::ReadAllText("Package.appxmanifest")
          $m = $m -replace '(<Identity[^>]*Version=")[\d.]+(")', "`${1}$v.0`${2}"
          [IO.File]::WriteAllText("Package.appxmanifest", $m, [Text.UTF8Encoding]::new($true))

      # All variants pull the Windows App SDK automatically as the
      # Microsoft.WindowsAppRuntime.2 framework package from the Store at install
      # (PackageDependency is injected by the build).
      #
      # Variant 1 (experimental): AOT MSIX - NativeAOT exe only (~5 MB). Full
      # feature set: WMI (internal laptop panels) works via WmiLight, which is
      # AOT-compatible.
      # NOTE: no --no-restore and no upfront restore - the ILCompiler toolchain is
      # only pulled in when PublishAot=true is set during restore, so let publish
      # restore itself. MSIX-constant flags (EnableMsixTooling, AppxBundle, ...)
      # live in the csproj's BuildMSIX property group.
      - name: Publish MSIX (AOT)
        run: >-
          dotnet publish -c Release -p:Platform=x64 -r win-x64
          -p:BuildMSIX=true -p:PublishAot=true
          -p:PackageCertificateKeyFile=cert.pfx
          -p:AppxPackageDir=out\aot\

      # The variants must not share intermediate state: switching PublishAot
      # on the same obj/bin corrupts the next package. Full reset.
      - name: Clean intermediates between variants
        shell: pwsh
        run: Remove-Item -Recurse -Force bin, obj -ErrorAction SilentlyContinue

      # Variant 2 (main): hybrid MSIX - trimmed .NET 10 runtime inside (~11 MB).
      - name: Publish MSIX (hybrid)
        run: >-
          dotnet publish -c Release -p:Platform=x64 -r win-x64
          -p:BuildMSIX=true -p:PublishAot=false -p:SelfContained=true
          -p:PublishTrimmed=true
          -p:PackageCertificateKeyFile=cert.pfx
          -p:AppxPackageDir=out\hybrid\

      # Each zip is self-contained: the install script expects the MSIX and the
      # cert next to itself. Names carry the version; the main (hybrid) zip is
      # named so it sorts first in the release asset list.
      - name: Stage artifacts
        shell: pwsh
        run: |
          $v = ([xml](Get-Content BrightFlyout.csproj)).Project.PropertyGroup.Version | Select-Object -First 1
          New-Item -ItemType Directory -Force staging | Out-Null
          function Pack($msixDir, $zipPath) {
            $zipStage = Join-Path $env:RUNNER_TEMP ([IO.Path]::GetRandomFileName())
            New-Item -ItemType Directory -Force $zipStage | Out-Null
            Copy-Item (Get-Item "$msixDir/**/*_x64.msix").FullName $zipStage/
            Copy-Item BrightFlyout.cer, tools/Install-BrightFlyout.ps1 $zipStage/
            Compress-Archive "$zipStage/*" $zipPath
          }
          Pack 'out/hybrid' "staging/BrightFlyout-$v-win-x64.zip"
          Pack 'out/aot' "staging/BrightFlyout-$v-win-x64.experimental-aot.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BrightFlyout-${{ github.sha }}
          path: staging/*
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create ${{ github.ref_name }}
          staging/*.zip
          --title "BrightFlyout ${{ github.ref_name }}"
          --generate-notes
