name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore -p:Platform=x64 -r win-x64

      - name: Publish (self-contained single file)
        run: >-
          dotnet publish -c Release -p:Platform=x64 -r win-x64 --self-contained --no-restore
          -p:WindowsAppSDKSelfContained=true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableMsixTooling=true

      - name: Package artifact
        shell: pwsh
        run: |
          $publish = "bin\x64\Release\net8.0-windows10.0.19041.0\win-x64\publish"
          Compress-Archive -Path "$publish\BrightFlyout.exe" -DestinationPath "BrightFlyout-win-x64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrightFlyout-win-x64
          path: BrightFlyout-win-x64.zip
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create ${{ github.ref_name }} BrightFlyout-win-x64.zip
          --title "BrightFlyout ${{ github.ref_name }}"
          --generate-notes
