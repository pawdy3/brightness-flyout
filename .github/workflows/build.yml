name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore -p:Platform=x64 -r win-x64

      # Artifact 1: NativeAOT single exe (~9 MB, zero prerequisites, portable).
      - name: Publish (NativeAOT exe)
        run: >-
          dotnet publish -c Release -p:Platform=x64 -r win-x64 --no-restore
          -p:PublishAot=true -p:EnableMsixTooling=true

      - name: Package AOT exe
        shell: pwsh
        run: |
          $publish = "bin\x64\Release\net10.0-windows10.0.19041.0\win-x64\publish"
          Compress-Archive -Path "$publish\BrightFlyout.exe" -DestinationPath "BrightFlyout-win-x64.zip" -Force

      # Artifact 2: MSIX installer (AOT exe + self-contained Windows App SDK,
      # zero prerequisites). Signed with the stable self-signed cert from the
      # MSIX_CERT_PFX_BASE64 secret (base64-encoded certs/BrightFlyout.pfx).
      - name: Decode signing certificate
        shell: pwsh
        run: |
          $b64 = "${{ secrets.MSIX_CERT_PFX_BASE64 }}"
          if ([string]::IsNullOrWhiteSpace($b64)) {
            throw "MSIX_CERT_PFX_BASE64 secret is not set. See README -> Distribution."
          }
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($b64))
          $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new("cert.pfx")
          [IO.File]::WriteAllBytes("BrightFlyout.cer", $cert.Export([Security.Cryptography.X509Certificates.X509ContentType]::Cert))

      # The MSIX identity version comes from the csproj <Version> (X.Y.Z -> X.Y.Z.0).
      - name: Stamp package version
        shell: pwsh
        run: |
          $v = ([xml](Get-Content BrightFlyout.csproj)).Project.PropertyGroup.Version | Select-Object -First 1
          $m = [IO.File]::ReadAllText("Package.appxmanifest")
          $m = $m -replace '(<Identity[^>]*Version=")[\d.]+(")', "`${1}$v.0`${2}"
          [IO.File]::WriteAllText("Package.appxmanifest", $m, [Text.UTF8Encoding]::new($true))

      - name: Publish (MSIX)
        run: >-
          dotnet publish -c Release -p:Platform=x64 -r win-x64 --no-restore
          -p:BuildMSIX=true -p:PublishAot=true -p:EnableMsixTooling=true
          -p:GenerateAppxPackageOnBuild=true -p:AppxBundle=Never
          -p:PackageCertificateKeyFile=cert.pfx

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BrightFlyout-${{ github.sha }}
          path: |
            BrightFlyout-win-x64.zip
            AppPackages/**/*_x64.msix
            BrightFlyout.cer
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create ${{ github.ref_name }}
          BrightFlyout-win-x64.zip (Get-Item AppPackages/**/*_x64.msix).FullName BrightFlyout.cer
          --title "BrightFlyout ${{ github.ref_name }}"
          --generate-notes
